<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arena Test — Babylon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#17191f; --blue:#3298f5; --dim:#8d97a8; --line:rgba(255,255,255,.14); --ok:#5ad07f; --air:#f0b54a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#8fb0c6;
    font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #renderCanvas { width:100%; height:100%; display:block; touch-action:none; outline:none; cursor:crosshair; }
  #hud { position:fixed; left:16px; top:16px; padding:11px 14px 10px; border-radius:10px;
    background:rgba(23,25,31,.84); border:1px solid var(--line); color:#e9edf5;
    backdrop-filter:blur(8px); pointer-events:none; }
  #hud h1 { margin:0; font-size:12px; letter-spacing:.22em; font-weight:700; }
  #hud h1 b { color:var(--blue); }
  #hud .meta { margin-top:6px; display:flex; gap:13px; font-size:11px; color:var(--dim);
    font-variant-numeric:tabular-nums; }
  #hud .meta span { color:#e9edf5; }
  #hud .meta span.air { color:var(--air); }
  #hud .meta span.ground { color:var(--ok); }
  #hud .keys { margin-top:8px; font-size:10px; letter-spacing:.08em; color:var(--dim); line-height:1.6; }
  #hud .keys kbd { font:inherit; color:#e9edf5; background:rgba(255,255,255,.09);
    border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  #status { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none;
    font-size:12px; letter-spacing:.18em; color:#17191f; transition:opacity .25s ease; }
  #status.hidden { opacity:0; }
  #status.error { color:#a3263a; letter-spacing:.04em; text-align:center; max-width:520px; line-height:1.6; }
  #hint { position:fixed; left:50%; bottom:44px; transform:translateX(-50%);
    padding:10px 18px; border-radius:999px; background:rgba(23,25,31,.8); color:#e9edf5;
    border:1px solid var(--line); font-size:11px; letter-spacing:.18em; pointer-events:none;
    transition:opacity .2s ease; }
  #hint.hidden { opacity:0; }
  @media (prefers-reduced-motion:reduce) { * { transition-duration:0ms !important; } }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="hud">
  <h1>ARENA <b>TEST</b></h1>
  <div class="meta">
    <div>SPEED <span id="mSpeed">0.0</span></div>
    <div>STATE <span id="mState">idle</span></div>
    <div><span id="mGround" class="ground">GROUND</span></div>
    <div>CAM <span id="mCam">CHASE</span></div>
    <div>FPS <span id="mFps">60</span></div>
  </div>
  <div class="meta"><div>TRIS <span id="mTris">–</span></div><div>JOINTS <span id="mJoints">53</span></div><div>HEIGHT <span id="mHeight">–</span></div></div>
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> WALK &middot; <kbd>SHIFT</kbd> SPRINT<br>
    <kbd>SPACE</kbd> JUMP &middot; <kbd>R</kbd> RESET &middot; <kbd>U</kbd> CAMERA &middot; <kbd>F</kbd> HOLD RIFLE<br>
    MOUSE LOOK &middot; <kbd>ESC</kbd> RELEASE
  </div>
</div>
<div id="hint" class="hidden">CLICK TO LOOK</div>
<div id="status">LOADING ARENA&hellip;</div>

<script src="vendor/babylon.js"></script>
<script src="vendor/babylon.glTF2FileLoader.js"></script>
<script src="assets/quaternius-mannequin.js?v=3"></script>
<script src="js/world.js?v=3"></script>
<script src="js/controller.js?v=15"></script>
<script src="js/animations.js?v=28"></script>
<script src="js/footik.js?v=8"></script>
<script src="js/main.js?v=71"></script>
</body>
</html>
